name: MLB Live Game Sniper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore state files
        uses: actions/cache/restore@v4
        with:
          path: |
            .odds_cache.json
            .entry_prices.json
          key: mlb-state-restore
          restore-keys: |
            mlb-state-

      - name: Install Dependencies
        run: pip install requests cryptography

      - name: Execute MLB Sniper
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python mlb_sniper.py

      - name: Save state files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .odds_cache.json
            .entry_prices.json
          key: mlb-state-${{ github.run_id }}-${{ github.run_attempt }}
