name: Continuous Sports & Politics Sniper

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Harvester Loop
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python beast_mode_bot.py
