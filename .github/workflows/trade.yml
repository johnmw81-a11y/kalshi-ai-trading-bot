name: Run Kalshi Gemini Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests cryptography python-dotenv aiosqlite structlog pandas numpy scipy matplotlib json_repair xai-sdk openai openrouter pydantic

      - name: Create key file
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > kalshi_private_key.pem

      - name: Run Trading Script
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_API_BASE_64_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: "google"
          MODEL_NAME: "gemini-2.0-flash"
          XAI_API_KEY: "not-used"
          OPENAI_API_KEY: "not-used"
          OPENROUTER_API_KEY: "not-used"
        run: python beast_mode_bot.py
