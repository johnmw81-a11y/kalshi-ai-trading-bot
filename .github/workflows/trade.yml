name: Continuous Sports & Politics Sniper
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests cryptography python-dotenv aiosqlite structlog pandas numpy scipy matplotlib json_repair xai-sdk openai openrouter pydantic

      - name: Create key file
        run: |
          echo "${{ secrets.KALSHI_PRIVATE_KEY }}" > temp_key.pem
          perl -pe 's/\\n/\n/g' temp_key.pem > kalshi_private_key.pem
          chmod 600 kalshi_private_key.pem

      - name: Run Sniper Loop
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_API_BASE_64_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: "google"
          MODEL_NAME: "gemini-2.0-flash"
          # TOPICS: Added Politics to the mix
          MARKET_TOPIC: "NCAAM, MLB, Politics, Congress, Elections"
          MAX_MARKETS_TO_PROCESS: "5"
          ENABLE_NEWS_SEARCH: "false"
          # RISK: Keeping your 60% discipline
          MAX_ORDER_VALUE: "20"
          STAKE_USD: "20"
          MIN_CONFIDENCE_THRESHOLD: "0.60"
          SLIPPAGE_PROTECTION: "0.03" 
          LOG_LEVEL: "DEBUG"
        run: |
          # This runs the bot, waits 3 minutes, then runs it again (2 times per workflow)
          python beast_mode_bot.py
          echo "Sleeping for 3 minutes before next check..."
          sleep 180
          python beast_mode_bot.py
