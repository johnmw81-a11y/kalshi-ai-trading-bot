name: Continuous Sports & Politics Sniper

on:
  schedule:
    - cron: '*/3 * * * *'  # Runs automatically every 3 minutes
  workflow_dispatch:      # Allows you to click "Run workflow" manually

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Execute Harvester Loop
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MARKET_TOPIC: "NCAAM, MLB, Politics, Texas Senate, DHS Shutdown"
        run: python beast_mode_bot.py

