- name: Run Sniper Loop
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_API_KEY: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_API_BASE_64_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ADD THIS LINE TO STOP THE CRASH:
          XAI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          AI_PROVIDER: "google"
          MODEL_NAME: "gemini-2.0-flash"
          MARKET_TOPIC: "NCAAM, MLB, Politics, Congress, Elections"
          MAX_MARKETS_TO_PROCESS: "5"
          ENABLE_NEWS_SEARCH: "false"
          MAX_ORDER_VALUE: "20"
          STAKE_USD: "20"
          MIN_CONFIDENCE_THRESHOLD: "0.60"
          SLIPPAGE_PROTECTION: "0.03" 
          LOG_LEVEL: "DEBUG"
        run: |
          python beast_mode_bot.py
          echo "Sleeping for 3 minutes..."
          sleep 180
          python beast_mode_bot.py
